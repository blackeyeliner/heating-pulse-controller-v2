<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 890" width="1600" height="890" role="img" aria-labelledby="hpc-sys-title hpc-sys-desc">
<title id="hpc-sys-title">Heating Pulse Controller: system overview</title>
<desc id="hpc-sys-desc">A radiator is fed by a high-pressure, variable-temperature supply through a valve held at a minimum reliable opening, an operating setting that stays fixed during heating; the return water is still warm. A radiator surface sensor and a room sensor placed away from radiator heat send measurements to a Home Assistant controller, which also receives the room target and mode as a setting. The controller learns a surface-temperature reference, accounts for warming after closure and adapts the cooling threshold. It sends open and close commands to the valve over MQTT/Zigbee2MQTT and reads back the valve limits, which confirms settings, not water flow. A strip lists physical controls, firmware antifreeze while the thermostat stays Off, valve communication retries with optional alert and backup heat, and optional window feedback.</desc>
