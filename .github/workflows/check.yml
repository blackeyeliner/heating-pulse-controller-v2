name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=custom_components/heating_pulse_controller_v2 --cov-report=term-missing
      - run: uv run python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: installation-package
          path: dist/*
